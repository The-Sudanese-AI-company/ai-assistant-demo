# Netlify build settings for the ONB Agent Copilot frontend.
# "base" is resolved from the repository root, not from this file.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Public URL of the FastAPI backend on Render. Baked into the bundle at build
# time by Vite (see src/lib/api.js). No trailing slash, no /api suffix.
# A variable with the same name set in the Netlify UI takes precedence.
[build.environment]
  VITE_API_URL = "https://ai-assistant-demo-zl7a.onrender.com"

# Single-page app: every route serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
