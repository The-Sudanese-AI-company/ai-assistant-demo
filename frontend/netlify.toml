# Netlify build settings for the ONB Agent Copilot frontend.
# "base" is resolved from the repository root, not from this file.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Set VITE_API_URL in the Netlify UI (Site settings > Environment variables)
# to the public URL of the FastAPI backend, e.g. https://onb-api.example.com

# Single-page app: every route serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
